<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday, Siva ❤️</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:28px 16px;display:flex;align-items:center;justify-content:center;text-align:center;font-family:Georgia,serif;color:#542b28;background:linear-gradient(135deg,#ffb45d,#ffd39b,#fff0d4)}.card{width:100%;max-width:760px;padding:35px 22px;background:#fff8ed;border:3px solid #fff0d8;border-radius:26px;box-shadow:0 12px 35px #9c492c33}h1{font-size:clamp(30px,6vw,46px);color:#9b3a32;margin:10px 0 22px}.wishes{font-size:clamp(18px,3.5vw,22px);line-height:1.8}.heart{font-size:38px}.surprise-btn{margin-top:24px;padding:17px 30px;border:0;border-radius:50px;background:linear-gradient(135deg,#ff3399,#cc33cc);color:white;font-size:19px;font-weight:bold;cursor:pointer;box-shadow:0 6px 18px #dc28804d;transition:transform .25s}.surprise-btn:hover{transform:scale(1.06)}
</style>
</head>
<body><main class="card">
<div class="heart">❤️ 🎂 ❤️</div>
<h1>Happy Birthday, My Dear Siva!</h1>
<div class="wishes">Wishing you lots of happiness and love. 🥰<br>You are a special person in my life. 💗<br>May your dreams come true and may you always keep smiling. ✨<br>Have a wonderful birthday! 💖</div>
<button class="surprise-btn" onclick="window.location.href='surprise.html'">💖 Click for a Surprise! 🎁</button>
</main></body></html>
